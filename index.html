/* side art */
body::before,body::after{content:'';position:fixed;top:0;bottom:0;width:clamp(150px,20vw,340px);z-index:0;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:var(--artO,.2)}
body::before{left:var(--rail);background-image:var(--artL);-webkit-mask-image:linear-gradient(90deg,#000 0,transparent 100%);mask-image:linear-gradient(90deg,#000 0,transparent 92%)}
body::after{right:0;background-image:var(--artR);-webkit-mask-image:linear-gradient(270deg,#000 0,transparent 100%);mask-image:linear-gradient(270deg,#000 0,transparent 100%)}
body[data-route=shelf]{--artL:var(--art-mono);--artR:var(--art-night)}
body[data-route=tonight]{--artL:var(--art-night);--artR:var(--art-crimson)}
body[data-route=diary]{--artL:var(--art-crimson);--artR:var(--art-mono)}
body[data-route=people]{--artL:var(--art-face);--artR:var(--art-night);--artO:.24}
body[data-route=insights]{--artL:var(--art-ink);--artR:var(--art-mono);--artO:.15}
body[data-route=downloads]{--artL:var(--art-mono);--artR:var(--art-crimson)}
.main{position:relative;z-index:1}
@media (max-width:900px){body::before{left:0}body::before,body::after{width:clamp(70px,22vw,140px);--artO:.17}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{display:block}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--on);padding:8px 14px;border-radius:var(--r2);z-index:99}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* layout */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);padding:26px 18px 20px 22px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:var(--bg);z-index:20}
.brand{display:flex;align-items:flex-end;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font:800 36px/.8 var(--f-d);letter-spacing:.005em}
.logo{display:block;object-fit:contain;flex:none}
.omni-btn{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px 0 12px;border:1px solid var(--line2);border-radius:var(--r2);background:transparent;color:var(--ink2);text-align:left}
@media (hover:hover){.omni-btn:hover{background:var(--bg3);color:var(--ink)}}
.omni-btn span{flex:1}
kbd{font:500 11px/1 var(--f-u);padding:4px 6px;border:1px solid var(--line2);border-radius:4px;color:var(--ink3);background:var(--bg2)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:var(--r2);text-decoration:none;color:var(--ink3);font:700 27px/1 var(--f-d);letter-spacing:.01em}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a span{flex:1}
.nav a small{font:500 12px/1 var(--f-u);color:var(--ink3)}
@media (hover:hover){.nav a:hover{color:var(--ink);background:var(--bg2)}}
.nav a.on{color:var(--ink)}
.nav a.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--ac);transition:background .35s}
.brandrow{display:flex;align-items:center;justify-content:flex-start;gap:12px}
.aboutbtn{flex:none;display:grid;place-items:center;width:26px;height:26px;margin:-2px 0 0;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--ink2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:color .18s,background .18s,box-shadow .18s,transform .18s}
.aboutbtn svg{width:14px;height:14px}
.aboutbtn:active{transform:scale(.92)}
@media (hover:hover){.aboutbtn:hover{color:#1a1306;background:#e9b44c;box-shadow:0 0 0 4px rgba(233,180,76,.18)}}
.aboutbtn:focus-visible{outline:2px solid #e9b44c;outline-offset:2px}
.topbar .aboutbtn{margin:2px 0 0 10px;width:28px;height:28px;align-self:center}
.ab h2{margin-bottom:6px}.ab .lead{font:400 17px/1.55 var(--f-p);color:var(--ink2);margin:0 0 4px}
.ab h3{font:700 20px/1 var(--f-d);letter-spacing:.02em;margin:26px 0 8px;display:flex;align-items:center;gap:10px}
.ab h3::after{content:"";flex:1;height:1px;background:var(--line)}
.ab p,.ab li{font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0 0 8px}
.ab ul{margin:0;padding-left:18px}.ab li{margin-bottom:6px}.ab li b,.ab p b{color:var(--ink);font-weight:600}
.ab .fine{font-size:12.5px;color:var(--ink3)}
.wl-logo{display:block;margin-bottom:12px}.wl-mark{display:flex;align-items:flex-end;gap:5px;height:30px;margin-bottom:14px}.wl-mark i{display:block;width:7px;border-radius:2px;background:var(--l1);animation:wlUp .7s cubic-bezier(.2,.8,.2,1) backwards}
.wl-mark i:nth-child(1){height:14px}.wl-mark i:nth-child(2){height:30px;background:var(--l2);animation-delay:.07s}.wl-mark i:nth-child(3){height:22px;background:var(--l3);animation-delay:.14s}.wl-mark i:nth-child(4){height:27px;background:var(--l4);animation-delay:.21s}.wl-mark i:nth-child(5){height:17px;background:var(--l5);animation-delay:.28s}
@keyframes wlUp{from{transform:scaleY(0);transform-origin:bottom}}
.wl-s{display:flex;gap:14px;align-items:flex-start;margin:0 0 12px}.wl-s p{margin:2px 0 0}.wl-s b{color:var(--ink);font-weight:600;font-size:15px}
.wl-n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(233,180,76,.16);color:#e9b44c;font:800 15px/1 var(--f-d)}
.wl-a{justify-content:flex-end}
@media (max-width:640px){.wl-a .btn{flex:1 1 100%}.wl-a .pri{order:-1}}
.tmdb-b{display:inline-flex;align-items:center;height:22px;text-decoration:none;flex:none}
.tmdb-t{padding:2px 9px;border-radius:6px;background:linear-gradient(90deg,#90cea1,#01b4e4);color:#0d253f;font:800 12px/1.4 var(--f-u);letter-spacing:.06em}
.tmdb-b svg,.tmdb-b img{height:100%;width:auto;display:block}
.tmdb-r{display:block;margin-bottom:8px}
.tmdb-f{display:flex;gap:12px;align-items:flex-start;margin-top:20px}.tmdb-f .note{margin:0;max-width:56ch}.tmdb-f .tmdb-b{margin-top:1px}

.pk-r{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:12px;background:none;color:var(--ink);text-align:left;cursor:pointer;min-height:56px}

.pk-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.pk-m b{font:600 15px/1.25 var(--f-u);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pk-m i{font-style:normal;font-size:12.5px;color:var(--ink3)}
.pk-k{width:20px;color:#e9b44c;font-weight:700;text-align:center}
.dl-sum{font:600 12.5px/1.3 var(--f-u);color:var(--ink2);margin-bottom:4px}.dl-prev[data-act]{cursor:pointer}
.dlc{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);grid-template-areas:"p c" "a c";gap:16px 28px;align-items:start}.dlc-p{grid-area:p}.dlc-c{grid-area:c}.dlc-a{grid-area:a;display:flex;gap:8px;flex-wrap:wrap}
.dlc .dl-prev{width:100%}.dlc-c h2{margin-bottom:6px}.dlc-d{color:var(--ink3);font-size:14px;line-height:1.4;margin-bottom:16px}.dlc-c .seg{display:flex;flex-wrap:wrap}.dlc-c .seg button{flex:1 1 auto}
@media (max-width:720px){.dlc{grid-template-columns:1fr;grid-template-areas:"p" "c" "a"}.dlc-p{display:flex;justify-content:center}}
.pks{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}.pks-r{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.05)}.pks-n{width:22px;text-align:center;font:800 20px/1 var(--f-d);color:#e9b44c}.pks-r button{flex:none;width:36px;height:36px;border:0;border-radius:9px;background:rgba(255,255,255,.07);color:var(--ink);font-size:15px;cursor:pointer}.pks-r button:disabled{opacity:.3;cursor:default}.pk-quick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.vd-opt{margin-top:12px;text-align:left}.vd-opt summary{cursor:pointer;font:600 14px/1 var(--f-u);color:var(--ink2);padding:6px 0}.vd-opt .field{margin-top:12px}.vd-opt .seg{display:flex;width:100%}.vd-opt .seg button{flex:1}

.sel.sm,.inp.sm{height:32px;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}

/* stars */
.rc{display:inline-flex;gap:2px;vertical-align:middle}

#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:90;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}

.tools{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.banner{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg2);margin:0 0 18px;font-size:13px;color:var(--ink2)}

.spine{position:relative;flex:none;width:var(--w);height:var(--h);margin:0;border:0;border-radius:2px 2px 0 0;background:var(--a,#777);color:var(--k,#fff);writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;box-shadow:inset 2px 0 0 rgba(255,255,255,.14),inset -3px 0 0 rgba(0,0,0,.18);transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .2s;overflow:hidden}

.face{position:relative;flex:none;width:var(--w);height:var(--h);margin:0 4px;padding:0;border:0;border-radius:3px;background:var(--bg3);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.09),0 14px 22px -12px var(--shade);transition:transform .22s cubic-bezier(.2,.7,.3,1)}

  .tools .mchips{gap:5px}
  .shm{flex:0 1 auto}
  .shbtn .shl-t{max-width:84px}
}
/* ===== SHELVES BUTTON FIT ===== */
@media (max-width:640px){
  .tools .mchips{flex-wrap:wrap}
  .tools .mchips .shm{flex:1 1 0;min-width:84px;max-width:100%;margin-left:0}
  .tools .mchips .shbtn{width:100%;max-width:none;min-width:0;justify-content:space-between;flex:none}
  .tools .mchips .shbtn .shl-t{flex:1 1 auto;min-width:0;max-width:none;text-align:left}
}
@media (max-width:350px){.mchips>.chip small{display:none}}
/* ===== MOBILE FIXES R3 ===== */
.tmdb-b{height:52px}.tmdb-b img{border-radius:8px}
@media (max-width:640px){
  .tools .mchips{flex-wrap:nowrap}
  .tools .mchips>.chip{flex:none}
  .tools .mchips .shm{flex:0 1 auto;min-width:48px;max-width:none;margin-left:auto}
  .tools .mchips .shbtn{width:auto;max-width:100%;min-width:0;justify-content:center;gap:6px;flex:none;padding:0 10px}
  .tools .mchips .shbtn .shi{flex:none}
  .tools .mchips .shbtn .shl-t{flex:0 1 auto;min-width:0;max-width:72px;text-align:left}
  .pagehead{align-items:center;row-gap:8px}
  .pagehead h1{flex:0 1 auto;margin:0}
  .pagehead:has(>.yr) h1{flex:1 1 auto}
  .pagehead>.yr{order:2;margin:0 0 0 auto;padding:2px}
  .pagehead>.yr .btn{width:32px;height:32px;font-size:18px}
  .pagehead>.yr b{min-width:50px;font-size:21px;line-height:1;text-align:center}
  .pagehead>.sub{order:3;flex:1 1 0;min-width:0;padding:0;font-size:13.5px;line-height:1.4}
  .pagehead:has(>.yr)>.sub{flex:1 1 52%}
  .pagehead>.seg{order:4;flex:1 1 100%;display:flex}
  .pagehead>.seg button{flex:1}
  .pagehead>.btn.pri{order:4;flex:0 0 auto;min-height:36px;height:36px;padding:0 16px;font-size:14px;margin-left:auto}
}
/* ===== YEAR VIDEO ===== */
.vd-ban{display:flex;align-items:center;gap:18px 24px;flex-wrap:wrap;justify-content:space-between;margin:0 0 22px;padding:18px 20px;border:1px solid var(--line2);border-radius:var(--r3);background:linear-gradient(135deg,var(--bg2),var(--bg))}
.vd-ban-t{flex:1 1 320px;min-width:0}.vd-ban h3{font:700 28px/1 var(--f-d);margin:6px 0 6px}.vd-ban p{color:var(--ink2);font-size:14.5px;line-height:1.5;max-width:56ch}
.vd-ban-k{display:inline-block;font:600 11px/1 var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:#1a1a1a;background:#f2b24c;padding:4px 8px;border-radius:999px}
.vd h2{font:800 38px/.9 var(--f-d);margin-bottom:14px}
.vd-stage{position:relative;aspect-ratio:9/16;height:min(64dvh,620px);max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;background:#171717;border:1px solid var(--line)}
.vd-stage canvas,.vd-stage video{display:block;width:100%;height:100%;object-fit:cover}
.vd-ld{position:absolute;inset:auto 0 18px 0;text-align:center;font:600 13px/1 var(--f-u);letter-spacing:.08em;text-transform:uppercase;color:#f2f2f2;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.vd-prog{height:3px;border-radius:3px;background:var(--line2);margin:12px auto 0;max-width:calc(min(64dvh,620px)*9/16);overflow:hidden}.vd-prog i{display:block;height:100%;width:0;background:#f2b24c}
.vd-mus{margin-top:12px}
.vd .note{margin-top:8px}
@media (max-width:640px){.vd-stage{height:min(58dvh,520px)}.vd-prog{max-width:calc(min(58dvh,520px)*9/16)}.vd-ban h3{font-size:24px}.vd-ban .btn{width:100%}}
/* ===== SPACING AND TONIGHT RESULT ===== */
@media (max-width:640px){
  .pagehead{margin-bottom:22px;row-gap:12px}
  .pagehead h1{margin-bottom:2px}
  .banner{margin-bottom:18px}
  .tools{gap:12px;margin-bottom:14px}
  .tools .mchips{gap:6px}
  .fbar{margin-bottom:10px}
  .tn-ctl .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tn-ctl .chips .chip{justify-content:center;height:44px;padding:0 4px}
  .bill{margin-top:16px;padding:18px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg2)}
  .bc-row{gap:24px}
  .bc{gap:16px}
  .bc-i h3{font-size:38px;margin:2px 0 8px}
  .tl{margin-top:24px;padding-top:20px;border-top:1px dashed var(--line2)}
  .tl-bar{height:70px}
  .acts-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .acts-row .btn{width:100%}
  .acts-row .btn:first-child,.acts-row .btn:nth-child(4){grid-column:1/-1}
  .acts-row .btn:first-child{min-height:48px}
}
/* ===== TONIGHT COMPACT ===== */
.tnc{display:grid;gap:14px;padding:16px 18px;margin-bottom:26px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg2)}
.tnc .lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.tnc-row{display:flex;gap:14px 26px;flex-wrap:wrap;align-items:flex-end}
.tnc-row>.field{min-width:0}
.tnc-len{flex:1 1 300px}
@media (min-width:641px){.tnc-row>.field:not(.tnc-len) .seg{width:auto}.tnc-row>.field:not(.tnc-len) .seg button{padding:0 18px}}
.tnc-sep{height:1px;background:var(--line)}
.tnc .seg{display:flex;width:100%;background:var(--bg)}
.tnc .seg button{flex:1;padding:0 6px;white-space:nowrap}
.tnc .chips{gap:6px}
.tnc .chip{height:34px;padding:0 14px}
.tnc .tbox{height:42px}
.tnc .tin{font-size:16px;height:34px;min-width:92px}
.tnc .tnow{height:32px}
@media (pointer:coarse){.tnc .chip{height:38px}.tnc .seg button{height:38px}}
@media (max-width:640px){
  .tnc{padding:14px;gap:12px}
  .tnc-row{flex-direction:column;align-items:stretch;gap:12px}
  .tnc-row>.field{width:100%;flex:none}
  .tnc .tbox{width:100%}
  .tnc .tin{flex:1}
  .tnc .seg button{font-size:12.5px;padding:0 4px}
}
/* ===== INSIGHTS CAP ===== */
.blk-more{flex:none;height:22px;padding:0 9px;border:1px dashed var(--line2);border-radius:4px;background:transparent;color:var(--ink2);font:600 11px/1 var(--f-u);white-space:nowrap}
.blk-more:hover{color:var(--ink);border-color:var(--ink3)}
.hr-b .blk-more{align-self:center}
.stack .blk-more{width:100%;height:20px;padding:0;font-size:10px}
/* ===== INSIGHTS GRID + SIGNATURE ===== */
.ins-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ins-h h2{margin:0}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 26px}
.mg-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.mg-t b{font:700 15px var(--f-d);color:var(--ink)}
.mg-d{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.gd{display:block;aspect-ratio:1;border-radius:3px;background:var(--line)}
.gd.e{background:transparent}
.gd.on{background:var(--a);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.gd.x2{box-shadow:inset 0 0 0 2px var(--ink)}
.flag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.fl{background:var(--bg);padding:12px 13px 11px;min-width:0}
.fl span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.fl b{display:block;font:800 clamp(22px,2.4vw,30px)/1 var(--f-d);overflow-wrap:anywhere}
.fl em{display:block;font-style:normal;color:var(--ink3);font-size:11.5px;line-height:1.3;margin-top:5px}
@media (max-width:999px){.flag{grid-template-columns:repeat(2,minmax(0,1fr))}.mgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (max-width:420px){.mgrid{gap:16px 12px}.mg-d{gap:2px}}

.eb{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.eb::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.cd h3{font:700 clamp(25px,2.5vw,31px)/1.04 var(--f-d);margin:12px 0 8px;max-width:19ch}
.cd p{color:var(--ink3);font-size:13px;line-height:1.5;max-width:46ch}
.cf{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:auto;padding-top:14px;font-size:12px;color:var(--ink3)}
.cf b{font:700 20px/1 var(--f-d);color:var(--ink);white-space:nowrap}
.cds .cd:nth-child(1){--bgi:var(--t1)}
.cds .cd:nth-child(2){--bgi:var(--t2)}
.cds .cd:nth-child(3){--bgi:var(--t3)}
.cds .cd:nth-child(4){--bgi:var(--t4)}
.cds .cd:nth-child(5){--bgi:var(--t5)}
.cds .cd:nth-child(6){--bgi:var(--t6)}
.cds .cd:nth-child(7){--bgi:var(--t7)}
.cds .cd:nth-child(8){--bgi:var(--t8)}
.cds .cd:nth-child(9){--bgi:var(--t1)}
.cds .cd:nth-child(10){--bgi:var(--t2)}
@media (max-width:760px){.cds{grid-template-columns:minmax(0,1fr)}.cd{min-height:0}.cd::before{width:70%;opacity:.22}}
.cds:not(.open) .cd.x{display:none}
.cds-b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;min-height:46px;border:1px solid var(--line2);border-radius:999px;background:transparent;color:var(--ink);font-size:14px;font-weight:600}
.cds-b:hover{background:var(--bg2)}
.cds-b svg{transition:transform .25s}
.cds-b[aria-expanded="true"] svg{transform:rotate(180deg)}
/* ===== RATINGS + DIRECTORS + TOP SPAN ===== */
.dl-tsp .seg{display:flex;width:100%}.dl-tsp .seg button{flex:1;padding:0 6px;font-size:12.5px}
.rx{position:relative;padding:18px 16px 12px;border:1px solid var(--line2);border-radius:18px;background:radial-gradient(120% 90% at 50% -10%,rgba(233,180,76,.14),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));overflow:hidden}
.rx-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rx-big{display:grid;gap:2px}.rx-big b{font:800 clamp(54px,9vw,78px)/.85 var(--f-d);background:linear-gradient(180deg,#ffe29a,#c98a2b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px rgba(233,180,76,.35))}
.rx-big span,.rx-p span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.rx-pills{display:flex;gap:8px}.rx-p{display:grid;gap:2px;padding:9px 14px;border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.04);min-width:84px}.rx-p b{font:800 24px/1 var(--f-d)}
.rh{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;height:230px;padding-top:30px;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.4px);background-size:16px 16px;background-position:center bottom 22px;-webkit-mask-image:none}
.rx-curve{position:absolute;left:0;right:0;top:48px;bottom:22px;width:100%;height:calc(100% - 70px);pointer-events:none;z-index:1;overflow:visible}
.rx-line{stroke:#ffeab8;stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(233,180,76,.9))}
.rh-c{display:grid;grid-template-rows:18px 1fr 22px;align-items:end;justify-items:center;border:0;background:transparent;padding:0;min-width:0;cursor:pointer;color:var(--ink);position:relative;z-index:2}
.rh-n{font:800 13px/18px var(--f-d);color:var(--ink2);text-shadow:0 0 6px var(--bg),0 0 6px var(--bg)}
.rh-b{display:block;align-self:end;width:100%;height:var(--h);min-height:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#f0c35c,rgba(201,138,43,.35));opacity:.8;transition:opacity .2s,transform .2s,filter .2s;transform-origin:bottom;box-shadow:inset 1px 0 0 rgba(255,255,255,.28);animation:rxUp .85s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*55ms)}
@keyframes rxUp{from{transform:scaleY(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.rh-b{animation:none}}
.rh-c.z .rh-b{background:var(--line);opacity:1;height:4px;box-shadow:none;border-radius:2px}
.rh-c.top .rh-b{opacity:1;background:linear-gradient(180deg,#ffe29a,#c98a2b);box-shadow:0 0 26px -2px rgba(233,180,76,.7),inset 1px 0 0 rgba(255,255,255,.4)}
.rh-c.top .rh-n{color:#ffe29a}
.rh-l{font-size:10.5px;color:var(--ink3);align-self:center}
.rh-c.top .rh-l{color:var(--ink);font-weight:700}
@media (hover:hover){.rh-c:hover .rh-b{opacity:1;transform:scaleY(1.04);filter:brightness(1.12)}.rh-c:hover .rh-n{color:var(--ink)}}
.rh-avg{position:absolute;top:22px;bottom:22px;width:2px;margin-left:-1px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));z-index:1;pointer-events:none}
.rh-avg::before{content:"";position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8)}
.rh-avg span{position:absolute;top:-30px;left:50%;transform:translateX(-50%);padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,#ffe29a,#e9b44c);color:#1a1306;font:700 10.5px/1.5 var(--f-u);white-space:nowrap;box-shadow:0 4px 16px -4px rgba(233,180,76,.7)}
.rh-avg:first-child span{}
.drs{display:grid;gap:4px}
.dr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}
.dr-i{font:700 14px var(--f-d);color:var(--ink3);letter-spacing:.05em}
.dr-n{display:grid;gap:5px;text-align:left;border:0;background:transparent;padding:0;color:var(--ink);min-width:0}
.dr-n b{font:700 21px/1 var(--f-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-bar{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.dr-bar i{display:block;height:100%;border-radius:2px;background:var(--ink3)}
.dr-n small{font-size:12px;color:var(--ink3)}
.rg{--p:0;position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:conic-gradient(#e9b44c calc(var(--p)*1%),var(--line) 0)}
.rg::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.rg b{position:relative;font:800 17px/1 var(--f-d)}
.rg.none{background:none;border:1.5px dashed var(--line2)}.rg.none::before{display:none}.rg.none b{color:var(--ink3);font-size:15px}
@media (max-width:420px){.rh{gap:4px}.rx{padding:14px 10px 10px}.rx-p{min-width:0;padding:8px 10px}.rh-l{font-size:9.5px}.dr-n b{font-size:19px}}
.lst .dl-prev{background:#161616;position:relative;overflow:hidden}.lst .dl-prev canvas{width:100%;height:auto;display:block}.lst-pg{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font:600 13px/1 var(--f-u);color:var(--ink2)}.lst-pg .ico{width:36px;padding:0}.lst-prog{position:absolute;inset:0;background:rgba(10,10,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:#fff}.lst-prog[hidden]{display:none}.lst-prog .vd-prog{width:80%;max-width:none}.lst .lst-dl:disabled{opacity:.5}.lst select.inp{height:40px}
</style></head>

    '<h2>Welcome to Dailies</h2>' +
    '<p class="lead">We are really glad you are here. This is a calm little corner for the films in your life: the ones you loved, the ones you forgot, and the ones still waiting for a quiet night.</p>' +
    '<h3>A gentle way to start</h3>' +
    st(1, 'Add a film you watched recently', 'Press the <b>+</b> button, or <kbd>/</kbd> to search. Mark it as seen, give it stars, and write a line about how it felt.') +
    st(2, 'Already have a history?', 'Bring it over from Letterboxd in Settings. Your films, ratings and diary dates come with you, and nothing gets duplicated.') +
    st(3, 'Let it grow', 'The more honestly you log, the more Insights, People and Downloads have to say about your taste.') +
    '<h3>A few small pieces of advice</h3>' +
    '<ul><li><b>Rate by feeling, not by rules.</b> There is no correct score. Your 3.5 is yours.</li>' +
    '<li><b>Write something, even one line.</b> Years from now, a single sentence will bring the whole evening back.</li>' +
    '<li><b>Your library lives in this browser.</b> Export a backup now and then, especially before clearing browser data or switching phones.</li>' +
    '<li><b>The ten films you see on the shelf are samples</b> so it is not empty. Remove them whenever you like.</li></ul>' +
    '<p class="fine">You can read the full story, the privacy notes and the fine print any time from the small info button beside the name.</p>' +
    '<div class="acts wl-a"><button type="button" class="btn" data-act="wlcabout">About Dailies</button><button type="button" class="btn" data-act="wlcimport">Import from Letterboxd</button><button type="button" class="btn pri" data-act="wlcgo" autofocus>Start exploring</button></div></div>',
    { wide: true, label: 'Welcome to Dailies', onClose: welcomeMark });
  const bx = $('#dlgBox'); bx.scrollTop = 0; setTimeout(() => { bx.scrollTop = 0; }, 60);
}
ACT.wlcgo = () => { closeDlg(); setTimeout(() => { try { openOmni('films'); } catch (e) { } }, 120); };
ACT.wlcimport = () => { closeDlg(); setTimeout(() => openSettings(), 120); };
ACT.wlcabout = () => { closeDlg(); setTimeout(() => aboutDlg(), 120); };
function shortcutsDlg() {
  const rows = [['/ or Ctrl K', 'Find a film, director, actor or command'], ['n', 'Log a watch'], ['g then s', 'Go to Shelf'], ['g then t', 'Go to Tonight'], ['g then d', 'Go to Diary'], ['g then p', 'Go to People'], ['g then i', 'Go to Insights'], ['g then w', 'Go to Downloadables'], ['Esc', 'Close whatever is open'], ['?', 'Show this list']];
  openDlg('<h2>Keyboard shortcuts</h2><table class="keys">' + rows.map(r => '<tr><td><kbd>' + E(r[0]) + '</kbd></td><td>' + E(r[1]) + '</td></tr>').join('') + '</table><div class="acts"><button class="btn pri" type="button" data-act="dlgx">Done</button></div>', { label: 'Keyboard shortcuts' });
}
document.addEventListener('keydown', e => {
  const t = e.target, typing = t.matches && t.matches('input,textarea,select,[contenteditable]');
  if (e.key === 'Escape') {
    if (!$('#cf').hidden) return;
    if (!$('#dlg').hidden) { closeDlg(); return; }
    if (!$('#omni').hidden) { if (typeof closeOmni === 'function') closeOmni(); return; }
    if (typeof panelOpen === 'function' && panelOpen()) { closePanel(); return; }
  }
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (typeof openOmni === 'function') openOmni(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); if (typeof openOmni === 'function') openOmni(); return; }
  if (e.key === '?') { shortcutsDlg(); return; }
  if (gPending) { gPending = false; const r = { s: 'shelf', t: 'tonight', d: 'diary', p: 'people', i: 'insights', w: 'downloads' }[e.key]; if (r) go(r); return; }
  if (e.key === 'g') { gPending = true; setTimeout(() => { gPending = false; }, 900); return; }
  if (e.key === 'n' && typeof openLog === 'function') { e.preventDefault(); openLog(); }
});
addEventListener('hashchange', () => { route = parseRoute(); if (typeof closePanel === 'function') closePanel(); window.scrollTo(0, 0); refresh(); });
let lastW = 0;
function onWidth() {
  const w = $('#view').clientWidth; if (Math.abs(w - lastW) < 6) return; lastW = w;
  if (typeof renderDock === 'function') renderDock();
  if (route === 'shelf' && S.ui.view === 'spines') renderShelfBody();
}
function boot() {
  if (!load() || (!S.set.seeded && !S.films.length)) seedLib();
  applyTheme(); route = parseRoute(); renderLogo();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.set.theme === 'auto') { applyTheme(); syncAccent(); } }); } catch (e) { }
  [['#omniBtn', () => openOmni()], ['#omniBtn2', () => openOmni()], ['#btnLog', () => openLog()], ['#btnLog2', () => openLog()], ['#btnSettings', () => openSettings()], ['#btnSettings2', () => openSettings()]]
    .forEach(([s, fn]) => { const el = $(s); if (el) el.addEventListener('click', () => { if (typeof fn === 'function') try { fn(); } catch (err) { console.error(err); } }); });
  refresh();
  if (typeof ResizeObserver === 'function') new ResizeObserver(onWidth).observe($('#view')); else addEventListener('resize', onWidth);
  lastW = $('#view').clientWidth;
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastW = 0; onWidth(); }); } catch (e) { }
  hydrate(); ensurePals();
  if (ownFilmCount() > 0) keepStorage();
  setTimeout(backupNudge, 5000);
  if (!welcomeSeen() && !S.films.some(f => !f.sample)) setTimeout(() => { if ($('#dlg').hidden && !welcomeSeen()) welcomeDlg(); }, 500);
}
try { boot(); } catch (err) { console.error(err); document.body.insertAdjacentHTML('afterbegin', '<p style="padding:20px;font:14px sans-serif">Something went wrong starting Dailies. Open the browser console for details.</p>'); }
